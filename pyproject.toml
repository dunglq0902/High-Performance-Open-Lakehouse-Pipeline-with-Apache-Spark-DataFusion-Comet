[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-comet-bench"
version = "0.1.0"
description = "Reproducible Spark versus DataFusion Comet lakehouse benchmark control plane"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Lakehouse Comet Benchmark Contributors" }]
dependencies = [
  "jsonschema==4.25.1",
  "pyarrow==21.0.0",
  "PyYAML==6.0.2",
  "referencing==0.36.2",
  "rfc3339-validator==0.1.4",
  "tzdata==2026.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.2",
  "pytest-cov==6.2.1",
  "ruff==0.12.11",
  "types-jsonschema==4.25.1.20251009",
  "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
lakehouse-bench = "benchmark.cli:main"

[tool.setuptools.packages.find]
include = ["analysis*", "benchmark*", "data*", "pipeline*", "scripts*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["analysis", "benchmark", "data.generator", "data.tpch", "pipeline", "scripts"]

[[tool.mypy.overrides]]
module = ["pyspark", "pyspark.*"]
ignore_missing_imports = true
