name: Native Linux smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.13
      - run: python -m pip install uv==0.8.15
      - run: uv sync --all-extras --frozen
      - name: CPU native-library preflight
        run: |
          if [[ "$(uname -m)" == "x86_64" ]] && ! grep -qw avx2 /proc/cpuinfo; then
            echo "Comet's published amd64 binary requires x86-64-v3/AVX2" >&2
            exit 1
          fi
      - run: bash scripts/run_native_smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-smoke-readiness-artifacts
          path: |
            .artifacts/smoke
            .artifacts/spark-events
          if-no-files-found: warn
