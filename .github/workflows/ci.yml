name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.12.13
      - name: Install locked toolchain
        run: python -m pip install uv==0.8.15
      - name: Sync
        run: uv sync --all-extras --frozen
      - name: Static and unit gates
        run: make lint test
      - name: Generate fixture and immutable dry-run plan
        run: make plan
      - name: Render Compose configuration
        run: make compose-config
