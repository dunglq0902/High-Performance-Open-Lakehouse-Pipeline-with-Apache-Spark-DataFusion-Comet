name: lakehouse-comet

x-aws-environment: &aws-environment
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?run python scripts/bootstrap_env.py}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run python scripts/bootstrap_env.py}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}

x-spark-common: &spark-common
  build:
    context: .
    dockerfile: infrastructure/docker/spark/Dockerfile
  image: lakehouse/spark-comet-iceberg:4.1.3-1.0.0-1.11.0
  networks: [lakehouse]
  environment:
    <<: *aws-environment
  volumes:
    - ./.artifacts:/opt/lakehouse/.artifacts
    - ./.runtime:/opt/lakehouse/.runtime
    - ./data/generated:/opt/lakehouse/data/generated:ro

services:
  minio:
    build:
      context: .
      dockerfile: infrastructure/docker/minio/Dockerfile
    image: lakehouse/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address :9001
    networks: [lakehouse]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run python scripts/bootstrap_env.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run python scripts/bootstrap_env.py}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "/init/init-buckets.sh"]
    networks: [lakehouse]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run python scripts/bootstrap_env.py}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run python scripts/bootstrap_env.py}
    volumes:
      - ./infrastructure/minio:/init:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  iceberg-rest:
    build:
      context: .
      dockerfile: infrastructure/docker/iceberg-rest/Dockerfile
    image: lakehouse/iceberg-rest-fixture:1.10.1
    networks: [lakehouse]
    environment:
      <<: *aws-environment
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:sqlite:/var/lib/iceberg/iceberg_catalog.db
      CATALOG_JDBC_USER: user
      # SQLite ignores JDBC authentication. Keep this explicit non-secret value so the REST
      # fixture cannot print a generated credential when it logs catalog properties.
      CATALOG_JDBC_PASSWORD: unused-local-fixture
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      REST_PORT: "8181"
    ports:
      - "127.0.0.1:8181:8181"
    volumes:
      - iceberg-catalog:/var/lib/iceberg
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8181/v1/config"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  spark-master:
    <<: *spark-common
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  spark-worker:
    <<: *spark-common
    cpus: "2.0"
    mem_limit: 5g
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "2"
      - --memory
      - 5g
      - --webui-port
      - "8081"
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8081 >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  spark-client:
    <<: *spark-common
    cpus: "2.0"
    mem_limit: 5g
    profiles: [tools]
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    depends_on:
      iceberg-rest:
        condition: service_healthy
      spark-worker:
        condition: service_healthy

networks:
  lakehouse:
    driver: bridge

volumes:
  minio-data:
  iceberg-catalog:
